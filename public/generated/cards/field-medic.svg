  <defs>
    <linearGradient id="sky-field-medic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0e15"/>
      <stop offset="100%" stop-color="#040407"/>
    </linearGradient>
    <radialGradient id="drown-field-medic" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#d9a866" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#d9a866" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d9a866" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig-field-medic" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="78%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="back-field-medic" cx="35.9%" cy="30.9%" r="58%">
      <stop offset="0%" stop-color="#d9a866" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#d9a866" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d9a866" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shaft-field-medic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8c4d9" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#b8c4d9" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#b8c4d9" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="rim-field-medic" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dy="2.4" result="down"/>
      <feComposite in="SourceAlpha" in2="down" operator="out" result="topEdge"/>
      <feGaussianBlur in="topEdge" stdDeviation="0.7" result="topSoft"/>
      <feFlood flood-color="#b8c4d9" flood-opacity="0.95"/>
      <feComposite in2="topSoft" operator="in" result="topRim"/>
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.3" result="grown"/>
      <feComposite in="grown" in2="SourceAlpha" operator="out" result="edge"/>
      <feGaussianBlur in="edge" stdDeviation="1" result="edgeSoft"/>
      <feFlood flood-color="#b8c4d9" flood-opacity="0.42"/>
      <feComposite in2="edgeSoft" operator="in" result="allRim"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="haloBlur"/>
      <feFlood flood-color="#d9a866" flood-opacity="0.5"/>
      <feComposite in2="haloBlur" operator="in" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="allRim"/>
        <feMergeNode in="topRim"/>
      </feMerge>
    </filter>
  </defs>
